<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1000" viewBox="0 0 2000 1000"><style>
.h{font-family:'Space Grotesk',ui-sans-serif, system-ui, sans-serif;font-weight:600}
.b{font-family:'Inter',ui-sans-serif, system-ui, sans-serif;font-weight:400}
.bb{font-family:'Inter',ui-sans-serif, system-ui, sans-serif;font-weight:600}</style><defs><filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".28"/></filter></defs><defs>
      <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#f0f1f9" stroke-opacity="0.07" stroke-width="1"/></pattern>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="180"/></filter>
      <radialGradient id="fade" cx=".5" cy=".5" r=".75"><stop offset=".3" stop-color="#0b0c16" stop-opacity="0"/><stop offset="1" stop-color="#0b0c16"/></radialGradient>
    </defs>
    <rect width="2000" height="1000" fill="#0b0c16"/>
    <rect width="2000" height="1000" fill="url(#grid)"/>
    <circle cx="1640" cy="200" r="420" fill="#6366f1" fill-opacity="0.55" filter="url(#glow)"/>
    <circle cx="1240" cy="950" r="340" fill="#f472b6" fill-opacity="0.4" filter="url(#glow)"/>
    <rect width="2000" height="1000" fill="url(#fade)"/>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="160" height="160" x="920" y="160" preserveAspectRatio="xMidYMid meet"><path d="M48 4 92 48 48 92 4 48Z" fill="#6366f1"/><path d="M48 4 92 48H4Z" fill="#f472b6"/></svg>
