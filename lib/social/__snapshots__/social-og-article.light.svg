<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><style>
.h{font-family:'Space Grotesk',ui-sans-serif, system-ui, sans-serif;font-weight:600}
.b{font-family:'Inter',ui-sans-serif, system-ui, sans-serif;font-weight:400}
.bb{font-family:'Inter',ui-sans-serif, system-ui, sans-serif;font-weight:600}</style><defs><filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".28"/></filter></defs><defs>
      <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#14151f" stroke-opacity="0.06" stroke-width="1"/></pattern>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="113"/></filter>
      <radialGradient id="fade" cx=".5" cy=".5" r=".75"><stop offset=".3" stop-color="#fafbff" stop-opacity="0"/><stop offset="1" stop-color="#fafbff"/></radialGradient>
    </defs>
    <rect width="1200" height="630" fill="#fafbff"/>
    <rect width="1200" height="630" fill="url(#grid)"/>
    <circle cx="983.9999999999999" cy="126" r="264.59999999999997" fill="#6366f1" fill-opacity="0.35" filter="url(#glow)"/>
    <circle cx="744" cy="598.5" r="214.20000000000002" fill="#f472b6" fill-opacity="0.28" filter="url(#glow)"/>
    <rect width="1200" height="630" fill="url(#fade)"/>
    <rect width="1200" height="10" fill="#6366f1"/>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="44" height="44" x="80" y="98" preserveAspectRatio="xMidYMid meet"><path d="M48 4 92 48 48 92 4 48Z" fill="#6366f1"/><path d="M48 4 92 48H4Z" fill="#f472b6"/></svg>
    <text class="h" x="137.2" y="133.2" font-size="35.2" fill="#14151f" text-anchor="start">Acme</text>
    <text class="h" x="80" y="250" font-size="68" fill="#14151f" text-anchor="start">Design tools for people</text><text class="h" x="80" y="323.44" font-size="68" fill="#14151f" text-anchor="start">who ship.</text>
    <text class="b" x="80" y="383.44" font-size="28" fill="#525461" text-anchor="start">Open source. Local first. Free forever.</text>
