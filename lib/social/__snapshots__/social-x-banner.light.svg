<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500"><style>
.h{font-family:'Space Grotesk',ui-sans-serif, system-ui, sans-serif;font-weight:600}
.b{font-family:'Inter',ui-sans-serif, system-ui, sans-serif;font-weight:400}
.bb{font-family:'Inter',ui-sans-serif, system-ui, sans-serif;font-weight:600}</style><defs><filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".28"/></filter></defs><defs>
      <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#14151f" stroke-opacity="0.06" stroke-width="1"/></pattern>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
      <radialGradient id="fade" cx=".5" cy=".5" r=".75"><stop offset=".3" stop-color="#fafbff" stop-opacity="0"/><stop offset="1" stop-color="#fafbff"/></radialGradient>
    </defs>
    <rect width="1500" height="500" fill="#fafbff"/>
    <rect width="1500" height="500" fill="url(#grid)"/>
    <circle cx="1230" cy="100" r="210" fill="#6366f1" fill-opacity="0.35" filter="url(#glow)"/>
    <circle cx="930" cy="475" r="170" fill="#f472b6" fill-opacity="0.28" filter="url(#glow)"/>
    <rect width="1500" height="500" fill="url(#fade)"/>
      <text class="h" x="520" y="210" font-size="60" fill="#14151f" text-anchor="start">Design tools for</text><text class="h" x="520" y="274.8" font-size="60" fill="#14151f" text-anchor="start">people who ship.</text>
      <text class="b" x="520" y="330.8" font-size="26" fill="#525461" text-anchor="start">Open source. Local first. Free forever.</text>
      <text class="bb" x="520" y="380.8" font-size="24" fill="#6366f1" text-anchor="start">acme.com  ·  @acme</text>
