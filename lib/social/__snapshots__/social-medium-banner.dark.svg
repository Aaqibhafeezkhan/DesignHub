<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500"><style>
.h{font-family:'Space Grotesk',ui-sans-serif, system-ui, sans-serif;font-weight:600}
.b{font-family:'Inter',ui-sans-serif, system-ui, sans-serif;font-weight:400}
.bb{font-family:'Inter',ui-sans-serif, system-ui, sans-serif;font-weight:600}</style><defs><filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".28"/></filter></defs><defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f0f1f9" stroke-opacity="0.07" stroke-width="1"/></pattern>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
      <radialGradient id="fade" cx=".5" cy=".5" r=".75"><stop offset=".3" stop-color="#0b0c16" stop-opacity="0"/><stop offset="1" stop-color="#0b0c16"/></radialGradient>
    </defs>
    <rect width="1500" height="500" fill="#0b0c16"/>
    <rect width="1500" height="500" fill="url(#grid)"/>
    <circle cx="1230" cy="100" r="210" fill="#6366f1" fill-opacity="0.55" filter="url(#glow)"/>
    <circle cx="930" cy="475" r="170" fill="#f472b6" fill-opacity="0.4" filter="url(#glow)"/>
    <rect width="1500" height="500" fill="url(#fade)"/>
