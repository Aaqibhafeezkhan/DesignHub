name: Visual

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update:
        description: "Make the screenshots again and commit them to main (after an intended layout change)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Drop the Microsoft apt source
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Are there screenshots to compare with?
        id: have
        run: |
          if [ -d tests/e2e/__screenshots__ ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; fi
      - name: Make the screenshots
        if: ${{ inputs.update }}
        run: VISUAL=1 pnpm exec playwright test tests/e2e/visual.spec.ts --update-snapshots
      - name: Commit the screenshots
        if: ${{ inputs.update }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          git commit -m "test: update the screenshots" || echo "Nothing changed"
          git push
      - name: Compare with the screenshots
        if: ${{ !inputs.update && steps.have.outputs.yes == 'true' }}
        run: VISUAL=1 pnpm exec playwright test tests/e2e/visual.spec.ts
      - name: No screenshots yet
        if: ${{ !inputs.update && steps.have.outputs.yes != 'true' }}
        run: echo "::notice::tests/e2e/__screenshots__ does not exist yet. Run this workflow by hand with update ticked to make it."
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
